name: Ордуэй
fullName: мистер Клемент Ордуэй
role: antagonist
summary: |
  Английский коллекционер и меценат, около 50 лет, столп английской колонии Флоренции, щедрый заказчик
  и «покровитель» Андреа. Тайно — Хранитель Лондонского кабинета Ордена. Ведёт собственную игру:
  хочет сорвать печать мундуса и забрать камень основания, чтобы стать магом, что Орден запрещает.
physical:
  age: "около 50"
  distinctiveFeatures: "безупречный белый костюм, трость с набалдашником-геммой (боевой артефакт), мягкий голос"
personality:
  core: "обаяние, терпение хищника"
  desires: "не хранить силу, а владеть ею"
  flaws: "презирает правила Ордена, считает себя выше описи"
background:
  occupation: "коллекционер, меценат, дилер древностей"
  hometown: "Лондон; во Флоренции — вилла на холмах Фьезоле"
skills:
  primarySkill: "боевой артефакт — трость-гемма"
voice:
  quirks:
    - Называет Андреа «мой мальчик»
  vocabulary: |
    Итальянский с изящным английским акцентом, цитирует Рёскина.
relationships:
  - character: Андреа
    type: rival
    description: Изображает покровителя; на самом деле использует его, чтобы добраться до мундуса.
  - character: Тальяферри
    type: rival
    description: Формально брат по Ордену, фактически соперник.
arc:
  startingState: "Щедрый покровитель."
  midpointCrisis: "Разоблачён как тот, кто хочет открыть мундус."
  endingState: "Ранен, бежит в Лондон с осколком камня основания — сквозной враг цикла."
