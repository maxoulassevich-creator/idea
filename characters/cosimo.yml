name: Козимо
fullName: барон Козимо Тарди дель Форо
role: background
summary: |
  Прадед Андреа, коллекционер эпохи Гранд-тура и брат Ордена. В 1790-х по поручению Ордена построил
  храм-музей над мундусом и завещал держать его открытым: внимание публики держит печать.
  Оставил замурованные записи.
