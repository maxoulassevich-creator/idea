name: Ла Рокка
fullName: делегат общественной безопасности Сальваторе Ла Рокка
role: major
summary: |
  Сицилиец, 40 лет, чужак во флорентийской полиции. О магии не знает, но замечает, что вокруг барона
  слишком много совпадений: мёртвый покупатель амулета, стрига, обрушения. Сначала охотник за Андреа,
  к финалу — настороженный союзник и первый контакт героя с государством.
physical:
  age: "40"
  distinctiveFeatures: "чёрный котелок, запах табака, вечно мятый воротничок"
personality:
  core: "упорство и недоверие к знати"
  strengths: "дотошность, чутьё на ложь"
  flaws: "презирает флорентийский снобизм, грубоват"
background:
  occupation: "делегат общественной безопасности (Pubblica Sicurezza), Флоренция"
  hometown: "Катания"
voice:
  quirks:
    - Задаёт один и тот же вопрос трижды разными словами
  vocabulary: |
    Сицилийский акцент, канцелярит протоколов вперемешку с поговорками.
relationships:
  - character: Андреа
    type: rival
    description: Подозреваемый, потом союзник, которому некому рассказать правду.
arc:
  startingState: "Уверен, что барон — мошенник или убийца."
  endingState: "Видел мундус; уносит тайну, которую некому доверить, и начинает свою игру для государства."
