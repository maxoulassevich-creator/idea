name: Тальяферри
fullName: маркиз Челсо Тальяферри
role: antagonist
summary: |
  Куратор Флорентийского кабинета Ордена, за шестьдесят. Член попечительских советов музеев и городской
  комиссии по древностям. Вежливый, рассудительный, страшный — лицо системы: не злодей, а бюрократ,
  который уже всё описал. В финале предлагает Андреа выбор: служба или исчезновение.
physical:
  age: "64"
  distinctiveFeatures: "перстень с ключом, вписанным в раскрытую книгу; всегда пьёт чай, а не кофе"
personality:
  core: "порядок превыше всего"
  strengths: "терпение, информированность, власть"
voice:
  quirks:
    - Говорит о людях как о единицах хранения
  vocabulary: |
    Изысканный тосканский, юридические обороты, латинские формулы Ордена.
relationships:
  - character: Андреа
    type: enemy
    description: Видит в нём ценный и опасный экспонат; в финале посвящает в Ученики.
notes: |
  - Знал прадеда Козимо по архивам и, возможно, мать Андреа лично.
