name: Беппе
fullName: Джузеппе Нальди
role: major
summary: |
  Сторож, кассир и единственный служащий музея Тарди, за шестьдесят. Ветеран походов Гарибальди,
  служил ещё отцу Андреа. Ворчун, антиклерикал, говорит только правду. Под его именем Андреа
  сдаёт реставрационные заказы.
physical:
  age: "63"
  distinctiveFeatures: "седые усы, хромает на левую ногу (Аспромонте, 1862), красная рубашка гарибальдийца под жилетом по праздникам"
personality:
  core: "верность и прямота"
  flaws: "упрям, презирает попов и аристократов (кроме «своего» барона)"
background:
  occupation: "сторож и кассир музея"
  significantEvents: "Тысяча Гарибальди; ранен при Аспромонте"
voice:
  quirks:
    - Называет Андреа «синьор барон» с интонацией, в которой слышна ирония
    - Сравнивает всё с кампаниями Гарибальди
  vocabulary: |
    Простонародный флорентийский говор, солдатские словечки.
relationships:
  - character: Андреа
    type: family
    description: Заменил ему отца после 1882 года, хоть и никогда в этом не признается.
notes: |
  - Племянник служит в Массауа (Эритрея) — ниточка к колониальному фону.
