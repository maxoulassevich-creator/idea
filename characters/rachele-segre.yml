name: Ракеле
fullName: Ракеле Сегре
role: major
summary: |
  Дочь старого антиквара из флорентийского гетто, 24 года. Семья лишилась дома и лавки из-за той же
  комиссии по сносу, что угрожает музею. Знает чёрный рынок древностей, скупщиков и контрабандистов
  лучше любого полицейского. Резкая, умная, упрямая; не терпит аристократического снисхождения.
physical:
  age: "24"
  distinctiveFeatures: "тёмные глаза, чернила на пальцах — ведёт книги отцовской лавки"
personality:
  core: "практичность и гнев на несправедливость"
  strengths: "связи, торговая хватка, смелость"
  flaws: "не доверяет никому, особенно титулованным"
background:
  occupation: "ведёт дела отцовской антикварной лавки (переехавшей в Сан-Фредиано)"
  family: "отец — Исакко Сегре, антиквар"
voice:
  quirks:
    - Называет Андреа «барон» как ругательство, пока не начнёт называть по имени
  vocabulary: |
    Быстрая речь торговки, цены и сроки; вставляет словечки из еврейско-итальянского жаргона.
relationships:
  - character: Андреа
    type: friend
    description: Сначала деловое партнёрство по делу о стриге, потом — союз и напряжённая симпатия.
notes: |
  - Её взгляд на Risanamento: снос гетто — не «оздоровление», а выселение.
