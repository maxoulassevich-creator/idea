name: Андреа
fullName: барон Андреа Тарди дель Форо
role: protagonist
summary: |
  Потомственный флорентийский барон, 28 лет, от рода которого остался только крошечный музей в виде
  римского храма у Старого рынка. Живёт в комнате за экспозицией, зарабатывает реставрацией и экспертизой
  антиквариата для английской колонии. Хочет спасти музей от сноса; рана — мать, умершая «от лихорадки»
  в 1878 году, и позор разорившегося отца. Пробуждает дар находчика — видит силу в вещах как карточки каталога.
physical:
  age: "28 (род. 1861)"
  build: "худощавый, сутулится от работы за верстаком"
  hands: "руки мастера: мозоли, въевшийся лак, мелкие ожоги"
  dress: "хороший, но старый костюм отца, перелицованный; всегда чистые манжеты"
  distinctiveFeatures: "пенсне для мелкой работы; после применения дара — кровь из носа"
personality:
  core: "педант и коллекционер; понимает вещи лучше людей"
  strengths: "терпение, память, наблюдательность, упрямство"
  flaws: "гордость, скрытность, язвительность, не умеет просить помощи"
  fears: "стать «сыном того самого Тарди»; потерять последнее"
  desires: "сохранить музей и достоинство рода; понять, что случилось с матерью"
background:
  occupation: "хранитель семейного музея; реставратор; эксперт по подлинности"
  education: "лицей, два курса в Пизе (бросил из-за разорения)"
  family: "отец — барон Лоренцо (ум. 1882); мать — Эвелин, урожд. Эшкомб (ум. 1878); прадед Козимо — основатель музея"
  hometown: "Флоренция"
  significantEvents: "1878 — смерть матери и крах отца; 1889 — пробуждение дара"
skills:
  primarySkill: "реставрация: рамы, мебель, часы, замки"
  secondarySkill: "атрибуция и экспертиза древностей; английский и латынь"
  gift: "дар находчика — картотека (см. world-rules)"
voice:
  patterns:
    - Говорит точно и сухо, как пишет в каталоге
    - Иронизирует над собой раньше, чем это сделают другие
  quirks:
    - Мысленно присваивает людям «инвентарные номера»
    - Протирает пенсне, когда тянет время
  vocabulary: |
    Правильный тосканский итальянский, с англичанами — безупречный английский матери.
    Музейная и антикварная терминология; избегает вульгарности.
relationships:
  - character: Беппе
    type: family
    description: Сторож музея, служил ещё отцу; единственный, кому Андреа доверяет безоговорочно.
  - character: Ракеле
    type: friend
    description: Союзница по делам; спорят постоянно; возможен роман в следующих томах.
  - character: Ордуэй
    type: mentor
    description: Покровитель и заказчик, в середине тома — главный враг.
  - character: Ла Рокка
    type: rival
    description: Полицейский, который его подозревает; к финалу — настороженный союзник.
  - character: Тальяферри
    type: enemy
    description: Куратор Ордена, который в финале принимает его в братство.
arc:
  startingState: |
    Одиночка, цепляется за музей как за последнее доказательство, что род чего-то стоит.
    Не верит в магию, считает условие завещания прадеда блажью.
  midpointCrisis: |
    Покровитель Ордуэй оказывается врагом; Андреа понимает, что музей — крышка над мундусом,
    а он сам — дичь для Ордена.
  endingState: |
    Спасает печать и музей ценой вступления в Орден Учеником. Из одиночки становится
    «своим среди чужих» и находит первую нить к судьбе матери.
notes: |
  - Тема: достоинство без денег; барон, работающий руками.
  - Заказы сдаёт под именем Беппе, чтобы не позорить титул.
