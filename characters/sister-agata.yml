name: сестра Агата
fullName: сестра Агата
role: minor
summary: |
  «Гончая» Ордена: живая волшебница на службе, монахиня с клеймом Хранителей, около 35 лет.
  Живое доказательство того, что происходит с магами в этом мире. Способна снести улицу — и в
  кульминации делает это, после чего газеты пишут об обрушении при работах.
physical:
  age: "около 35"
  distinctiveFeatures: "клеймо-ключ на запястье, перчатки, никогда не смотрит в глаза"
personality:
  core: "послушание, под которым тлеет что-то своё"
notes: |
  - Зеркало возможной судьбы Андреа. Возможная союзница в следующих томах.
