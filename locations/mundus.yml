name: Мундус
type: landmark
parentLocation: Музей Тарди
description: |
  Римская ритуальная шахта, заложенная у форума при основании Флоренции как вход в мир мёртвых.
  Круглая камера под погребом музея; в центре — камень основания, держащий печать.
rules:
  - Мундус открывается сам трижды в год — 24 августа, 5 октября, 8 ноября [проверить].
  - Пока печать слабеет, наружу выходят лемуры и стриги.
  - Кто завладеет камнем основания, получит силу мундуса.
firstAppearance: "Глава 1 (раскоп), полностью — кульминация"
