name: Музей Тарди
type: building
parentLocation: Флоренция
description: |
  Маленькое неоклассическое здание 1790-х в виде римского храма на краю Старого рынка: портик на четырёх
  колоннах, один зал с верхним светом, кабинет-мастерская, комната Андреа за экспозицией, погреб.
  Лучшее давно продано: на витринах гипсовые слепки, черепки, чучела, «меч крестоносца».
  Среди хлама — несколько настоящих артефактов.
details:
  architecture: "римский храм в миниатюре; фронтон с латинской надписью прадеда"
  notableFeatures: "замурованная ниша с записями Козимо; погреб на римском фундаменте"
  admission: "несколько чентезимо; кассир — Беппе"
rules:
  - По завещанию музей должен быть открыт для публики, иначе переходит Братству Милосердия.
  - Музей — крышка над мундусом; внимание посетителей держит печать.
  - Вещь, внесённая в каталог Андреа и выставленная в зале, «успокаивается».
firstAppearance: "Глава 1"
