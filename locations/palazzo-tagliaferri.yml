name: Палаццо Тальяферри
type: building
parentLocation: Флоренция
description: |
  Палаццо маркиза Тальяферри, где под видом «Общества любителей тосканских древностей» заседает
  Флорентийский кабинет Ордена. Библиотека с реестрами — «опись мира».
rules:
  - Вход в зал Кабинета — только для посвящённых; реестры не выносятся.
