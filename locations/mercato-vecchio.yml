name: Старый рынок
type: region
parentLocation: Флоренция
description: |
  Средневековый рыночный квартал и соседнее гетто, которые сносит коммунальная комиссия. Руины, леса, раскопы,
  выселенные жители, римская кладка под мостовой. Место, где «разрывают сердце города».
details:
  atmosphere: "грохот ломов, известковая пыль, торговки, которым некуда идти"
rules:
  - Работы идут по плану отчуждения; музей Тарди — на краю зоны сноса.
