name: Флоренция
type: city
description: |
  Бывшая столица Италии (1865–1871), разорённая после переезда двора в Рим. Город сносит собственное
  средневековое сердце ради «оздоровления»; полон английских и американских туристов, антикваров,
  подделок и вывозимых шедевров.
details:
  era: "май — ноябрь 1889"
  atmosphere: "пыль сносов, колокола, запах Арно, английская речь в пансионах"
  population: "около 190 тысяч [проверить]"
rules:
  - Официально магии нет; всё необъяснимое списывают на газ, обрушения и холеру.
  - Под центром лежит римская Флоренция с форумом и Капитолием.
notes: |
  - Факты для проверки: Risanamento (около 1885–1895), финансовый крах города в 1878 году.
