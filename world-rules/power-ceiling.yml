name: Потолок силы — одна улица
category: magic
description: |
  Сильнейший маг в одиночку способен разрушить не больше одной улицы. Маги — единицы на страну.
limitations: |
  Никаких «полгорода щелчком пальцев». Большое разрушение в городе маскируется под взрыв газа
  или обрушение при работах.
is_hard_rule: true
