name: Сила от внимания
category: magic
description: |
  Сила копится в предметах от человеческого внимания: молитвы, страха, восхищения, памяти.
  Чем больше и дольше внимание, тем сильнее заряд. Артефакты — реальные исторические вещи.
  Чудовища рождаются из веры народа, поэтому у каждой страны свои.
limitations: |
  Промышленный век верит меньше: старые заряды держатся, новые артефакты рождаются редко.
  Артефакт действует узко и сам по себе, а не как «заклинание».
is_hard_rule: true
