name: Дар находчика — картотека
category: magic
description: |
  Андреа видит силу в вещах как бледную карточку музейного каталога, написанную его собственным почерком:
  инвентарный номер, наименование, датировка, происхождение, заряд, состояние, угроза.
  Параметры дара — дальность, атрибуция, глубина, запас. Прокачка — это заполнение полей карточки.
limitations: |
  Перерасход вызывает мигрень, носовое кровотечение, провалы в памяти. Активный дар «фонит»,
  и его засекают детекторы Ордена. Андреа не маг: он не может сам творить магию,
  только находить, понимать, прятать и — с последствиями — применять артефакты по назначению.
  Атрибуция растёт, только когда вещь внесена в его каталог и её происхождение подтверждено документально.
is_hard_rule: true
established_in:
  chapter: 1
examples:
  - "Первая карточка над терракотой в раскопе у Старого рынка."
notes: |
  - Никаких слов «интерфейс», «уровень», «статы» в тексте: только язык каталога 1889 года.
  - Поздние поля (в следующих томах): «Владельцы», «Связи», «Истинное назначение».
