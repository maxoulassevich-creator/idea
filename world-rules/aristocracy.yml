name: Аристократия без магии
category: social
description: |
  Аристократия устроена исторически достоверно для Италии 1880-х: титулы признаются
  Геральдической консультой, но привилегий не дают. Работать руками барону закон не запрещает,
  но это позор в глазах общества. Статус никак не зависит от магии.
is_hard_rule: true
notes: |
  - Никакого «бояр-аниме»: родов-кланов, иерархии по силе, «глав рода» с армиями.
