name: Печать мундуса
category: magic
description: |
  Печать над римским мундусом держится камнем основания и вниманием посетителей музея, построенного
  над ним. Мундус открывается сам трижды в год (24 августа, 5 октября, 8 ноября).
limitations: |
  Пустой зал и земляные работы вокруг ослабляют печать, и наружу выходят лемуры и стриги.
  Внесённый в каталог и выставленный в зале камень основания «усыпляет» печать заново.
is_hard_rule: true
