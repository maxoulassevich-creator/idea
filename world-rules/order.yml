name: Братство Хранителей
category: political
description: |
  Тайное братство по образцу масонов, выросшее из инквизиционных комиссий XVI–XVII веков.
  Кредо: «Мы перестали жечь, когда научились описывать». Всякий опасный артефакт должен быть найден,
  описан и «усыплён» в собрании; маги выявляются и либо идут на службу, либо изолируются, либо исчезают.
  Ложи называются Кабинетами (Флорентийский, Римский, Лондонский); руководство — Великий Кабинет в Лондоне.
  Степени: Ученик, Регистратор, Хранитель, Куратор; высшие степени скрыты от младших.
  Символ — ключ, вписанный в раскрытую книгу описи.
limitations: |
  Действует через легальные институты: музеи, комиссии, таможню, аукционы, церковь.
  Использовать артефакты ради личной силы братьям запрещено.
  Настоящие масоны о Хранителях почти не знают; Орден использует их ложи как ширму.
is_hard_rule: true
