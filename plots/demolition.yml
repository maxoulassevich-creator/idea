name: Снос музея
type: subplot
status: planned
priority: 9
description: |
  Музей включён в план отчуждения Старого рынка. Компенсация ушла бы Братству Милосердия. Андреа
  бьётся с комиссией, налогами и пустым залом.
beats:
  - scene: "Глава 1"
    description: Уведомление об отчуждении; недоимки по налогу на строения.
    type: setup
  - scene: "Глава 11"
    description: Андреа превращает музей в модное место английской колонии, чтобы привлечь публику.
    type: development
  - scene: "Глава 19"
    description: Ордуэй через комиссию добивается сноса досрочно — в ночь на 8 ноября.
    type: development
  - scene: "Глава 23"
    description: Благодаря «археологической находке» линию сноса переносят, недоимки списаны — ценой сделки с Орденом.
    type: resolution
characters:
  - name: Андреа
    role: protagonist
  - name: Боски
    role: obstacle
