name: Печать мундуса
type: main
status: planned
priority: 10
description: |
  Под музеем Тарди лежит римский мундус. Снос Старого рынка и пустой зал ослабляют печать, наружу выходят
  чудовища, а Ордуэй хочет забрать камень основания. Удержит ли Андреа печать до 8 ноября?
beats:
  - scene: "Глава 1"
    description: Ночь Лемурий, раскоп у Старого рынка, первая карточка над римской терракотой.
    type: setup
  - scene: "Глава 9"
    description: После стриги Андреа понимает, что чудовищ выпускает снос.
    type: development
  - scene: "Глава 10"
    description: Тайник прадеда — музей построен как крышка над мундусом; внимание публики держит печать.
    type: development
  - scene: "Глава 16"
    description: 5 октября мундус приоткрывается, лемуры в музее. Андреа едва выживает и узнаёт про 8 ноября.
    type: development
  - scene: "Главы 21–22"
    description: Ночь на 8 ноября — схватка за камень основания под землёй, пока наверху ломают стены.
    type: climax
  - scene: "Глава 22"
    description: Андреа вносит камень в свой каталог и выставляет в зале — печать «усыплена» заново.
    type: resolution
characters:
  - name: Андреа
    role: protagonist
    arc: От «блажи прадеда» к роли хранителя печати.
  - name: Ордуэй
    role: antagonist
